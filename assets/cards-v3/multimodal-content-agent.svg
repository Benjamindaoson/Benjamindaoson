<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal Content Creation Agent architecture</title>
  <desc id="desc">Goal intake flows through an agent runtime into media tools, quality evaluation, and recoverable publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#162b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <text x="64" y="82" fill="#f0f6fc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Multimodal Content Creation Agent</text>
  <text x="64" y="120" fill="#8babc8" font-family="Inter,Arial,sans-serif" font-size="18">Recoverable planning · generation · evaluation · publishing</text>
  <rect x="64" y="168" width="220" height="118" rx="20" fill="#132f4c" stroke="#58a6ff" filter="url(#shadow)"/>
  <text x="174" y="216" text-anchor="middle" fill="#58a6ff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">CREATIVE GOAL</text>
  <text x="174" y="250" text-anchor="middle" fill="#d5e5f2" font-family="Inter,Arial,sans-serif" font-size="15">Brief · brand · platform</text>
  <rect x="348" y="154" width="310" height="288" rx="24" fill="#102a43" stroke="url(#accent)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503" y="202" text-anchor="middle" fill="#f0f6fc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">AGENT RUNTIME</text>
  <g fill="#193b5b" stroke="#2f6f9f">
    <rect x="390" y="232" width="226" height="44" rx="12"/><rect x="390" y="292" width="226" height="44" rx="12"/><rect x="390" y="352" width="226" height="44" rx="12"/>
  </g>
  <g text-anchor="middle" fill="#d5e5f2" font-family="Inter,Arial,sans-serif" font-size="15">
    <text x="503" y="260">Plan &amp; task state</text><text x="503" y="320">Checkpoint &amp; recovery</text><text x="503" y="380">Human approval</text>
  </g>
  <rect x="722" y="168" width="414" height="118" rx="20" fill="#132f4c" stroke="#7ee787" filter="url(#shadow)"/>
  <text x="929" y="216" text-anchor="middle" fill="#7ee787" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">MULTIMODAL TOOLS</text>
  <text x="929" y="250" text-anchor="middle" fill="#d5e5f2" font-family="Inter,Arial,sans-serif" font-size="15">Text · image · speech · video · FFmpeg</text>
  <rect x="722" y="330" width="194" height="112" rx="20" fill="#132f4c" stroke="#d2a8ff"/>
  <text x="819" y="376" text-anchor="middle" fill="#d2a8ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">QUALITY GATE</text>
  <text x="819" y="406" text-anchor="middle" fill="#d5e5f2" font-family="Inter,Arial,sans-serif" font-size="14">Judge · hard checks</text>
  <rect x="942" y="330" width="194" height="112" rx="20" fill="#132f4c" stroke="#ffa657"/>
  <text x="1039" y="376" text-anchor="middle" fill="#ffa657" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">PUBLISH</text>
  <text x="1039" y="406" text-anchor="middle" fill="#d5e5f2" font-family="Inter,Arial,sans-serif" font-size="14">Idempotency · feedback</text>
  <g stroke="#6e93b4" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M284 227h64"/><path d="M658 227h64"/><path d="M819 286v44"/><path d="M916 386h26"/>
  </g>
  <g fill="#6e93b4"><path d="m342 217 16 10-16 10z"/><path d="m716 217 16 10-16 10z"/><path d="m809 324 10 16 10-16z"/><path d="m936 376 16 10-16 10z"/></g>
  <rect x="64" y="500" width="1072" height="84" rx="18" fill="#0d2135" stroke="#254c6b"/>
  <text x="600" y="536" text-anchor="middle" fill="#8babc8" font-family="Inter,Arial,sans-serif" font-size="15">Reliability boundary</text>
  <text x="600" y="564" text-anchor="middle" fill="#f0f6fc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Durable artifacts · transient-only retries · failure recovery · execution traces</text>
</svg>